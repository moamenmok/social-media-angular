<ngx-spinner
  bdColor="rgba(255,255,255,0.97)"
  [fullScreen]="true"
  type="ball-scale-multiple"
  size="medium"
  [zIndex]="9999"
>
  <div class="egm-loader">
    <div class="stage">
      <svg class="egm-logo" viewBox="0 0 1024 1100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient
            id="egmGrad"
            gradientUnits="userSpaceOnUse"
            x1="0"
            y1="60"
            x2="0"
            y2="1000"
          >
            <stop offset="0" stop-color="#e03a52" />
            <stop offset="1" stop-color="#a5172f" />
          </linearGradient>

          <g id="egmShape">
            <path
              d="M107 390V785H274V546L420 680Q475 725 545 663L679 454V785H845V224L762 166L661 170L459 490L270 317L190 357Z"
            />
            <circle cx="190" cy="357" r="89" />
            <circle cx="762" cy="166" r="100" />
            <path d="M679 785H845L940 1000Z" />
          </g>

          <mask id="egmHoles" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1100">
            <rect width="1024" height="1100" fill="#fff" />
            <circle cx="190" cy="357" r="42" fill="#000" />
            <circle cx="762" cy="166" r="48" fill="#000" />
          </mask>
          <clipPath id="egmClip"><use href="#egmShape" /></clipPath>
        </defs>

        <g mask="url(#egmHoles)">
          <!-- الطبقة الباهتة (اللوجو فاضي) -->
          <use href="#egmShape" fill="#f2c9cf" />
          <!-- الطبقة الحمرا اللي بتطلع -->
          <g clip-path="url(#egmClip)">
            <rect class="fill" x="0" y="0" width="1024" height="1010" fill="url(#egmGrad)" />
          </g>
        </g>

        <circle class="dot d1" cx="380" cy="809" r="42" />
        <circle class="dot d2" cx="475" cy="809" r="42" />
        <circle class="dot d3" cx="571" cy="809" r="42" />
      </svg>
    </div>

    <p class="egm-name">EGM</p>
    <p class="egm-sub">Loading</p>
  </div>
</ngx-spinner>
<router-outlet></router-outlet>
