<div
  [class.translate-y-full]="!isVisible()"
  [class.translate-y-0]="isVisible()"
  class="fixed bottom-0 left-0 z-50 w-full border-t border-slate-200 bg-white/95 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]transition-transform duration-300 ease-in-out backdrop-blur-lg md:hidden"
>
  <div class="mx-auto grid h-16 max-w-lg grid-cols-5 font-medium">
    <!-- Home -->
    <a
      routerLink="/home"
      routerLinkActive="!text-brand"
      class="group inline-flex flex-col items-center justify-center gap-1 text-slate-500 transition hover:text-brand"
    >
      <i class="fa-solid fa-house text-xl"></i>
      <span class="text-xs font-semibold">Home</span>
    </a>

    <!-- Friends -->
    <a
      routerLink="/friends"
      routerLinkActive="!text-brand"
      class="group inline-flex flex-col items-center justify-center gap-1 text-slate-500 transition hover:text-brand"
    >
      <i class="fa-solid fa-user-group text-xl"></i>
      <span class="text-xs font-semibold">Friends</span>
    </a>

    <!-- Notifications -->
    <a
      routerLink="/notification"
      routerLinkActive="!text-brand"
      class="group relative inline-flex flex-col items-center justify-center gap-1 text-slate-500 transition hover:text-brand"
    >
      <span class="relative">
        <i class="fa-regular fa-bell text-xl"></i>

        <!-- Unread Badge -->
        @if (unreadCount() > 0) {
          <span
            class="absolute -top-1 -right-1 grid h-4 min-w-4 place-items-center rounded-full bg-brand px-1 text-2xs font-bold text-white ring-2 ring-white"
          >
            {{ unreadCount() }}
          </span>
        }
      </span>
      <span class="text-xs font-semibold">Notifications</span>
    </a>

    <!-- Profile -->
    <a
      routerLink="/profile"
      routerLinkActive="!text-brand"
      class="group inline-flex flex-col items-center justify-center gap-1 text-slate-500 transition hover:text-brand"
    >
      <i class="fa-regular fa-user text-xl"></i>
      <span class="text-xs font-semibold">Profile</span>
    </a>
    <!-- Menu -->
    <a
      routerLink="/menu"
      routerLinkActive="!text-brand"
      class="group inline-flex flex-col items-center justify-center gap-1 text-slate-500 transition hover:text-brand"
    >
      <i class="fa-solid fa-bars text-xl"></i>
      <span class="text-xs font-semibold">Menu</span>
    </a>
  </div>
</div>
