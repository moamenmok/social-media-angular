<div class="mx-auto space-y-4 lg:max-w-4xl">
  @if (isLoading()) {
    <div class="rounded-2xl border border-brand-100 bg-white p-8 text-center">
      <i class="fa-solid fa-spinner fa-spin text-2xl text-brand"></i>
      <p class="mt-3 text-sm text-slate-500">Loading saved posts...</p>
    </div>
  } @else if (errorMessage()) {
    <div class="rounded-2xl border border-red-100 bg-white p-6 text-center">
      <p class="text-sm text-red-600">{{ errorMessage() }}</p>
      <button
        type="button"
        (click)="loadBookmarks()"
        class="mt-3 rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-600"
      >
        Try again
      </button>
    </div>
  } @else {
    @for (post of savedPosts(); track post._id) {
      <app-post
        [post]="post"
        [forceSaved]="true"
        (deleted)="onPostDeleted($event)"
        (saveChanged)="onSaveChanged($event)"
      />
    } @empty {
      <div
        class="flex flex-col items-center gap-2 rounded-2xl border border-dashed border-brand-200 bg-white px-4 py-10 text-center"
      >
        <i class="fa-regular fa-bookmark text-3xl text-brand-300"></i>
        <p class="text-sm font-bold text-slate-700">Nothing saved yet</p>
        <p class="text-xs text-slate-500">Posts you bookmark will show up here.</p>
      </div>
    }
  }
</div>
