<aside
  class="min-h-screen lg:h-fit space-y-1 border border-slate-200 bg-white p-3 shadow-sm xl:sticky xl:top-21 xl:block"
>
  <!-- Navigation Links -->
  <nav class="space-y-1">
    <a
      routerLink="/home"
      routerLinkActive="bg-brand-50 text-brand"
      class="flex items-center gap-4 rounded-xl p-3 font-semibold text-slate-700 transition hover:bg-brand-50 hover:text-brand"
    >
      <i class="fa-solid fa-house w-6 text-center text-xl"></i>
      <span>Home</span>
    </a>

    <a
      routerLink="/saved"
      routerLinkActive="bg-brand-50 text-brand"
      class="flex items-center gap-4 rounded-xl p-3 font-semibold text-slate-700 transition hover:bg-brand-50 hover:text-brand"
    >
      <i class="fa-regular fa-bookmark w-6 text-center text-xl"></i>
      <span>Saved</span>
    </a>

    <a
      routerLink="/change-password"
      routerLinkActive="bg-brand-50 text-brand"
      class="flex items-center gap-4 rounded-xl p-3 font-semibold text-slate-700 transition hover:bg-brand-50 hover:text-brand"
    >
      <i class="fa-solid fa-lock w-6 text-center text-xl"></i>
      <span>Change Password</span>
    </a>
  </nav>

  <!-- Divider -->
  <div class="my-3 border-t border-slate-100"></div>

  <!-- Sign Out Button -->
  <button
    type="button"
    (click)="loggedOut()"
    class="flex w-full items-center gap-4 rounded-xl p-3 font-semibold text-red-500 transition hover:bg-red-50 cursor-pointer"
  >
    <i class="fa-solid fa-right-from-bracket w-6 text-center text-xl"></i>
    <span>Sign Out</span>
  </button>
</aside>
