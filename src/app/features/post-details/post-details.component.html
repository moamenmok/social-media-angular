<section class="mx-auto w-full max-w-4xl px-4 py-6">
  <!-- Back button -->
  <button
    type="button"
    (click)="goBack()"
    class="back-btn group mb-4 inline-flex items-center gap-2 rounded-full border border-brand-100 bg-white px-4 py-2 text-sm font-semibold text-slate-600 shadow-sm transition-all duration-300 hover:border-brand hover:bg-brand-50 hover:text-brand hover:shadow-md active:scale-95"
  >
    <i
      class="fa-solid fa-arrow-left transition-transform duration-300 group-hover:-translate-x-1"
    ></i>
    <span>Back</span>
  </button>

  @if (loading()) {
    <!-- Skeleton -->
    <div
      class="animate-pulse overflow-hidden rounded-2xl border border-brand-100 bg-white p-5 shadow-sm"
    >
      <div class="flex items-center gap-3">
        <div class="size-12 rounded-full bg-slate-200"></div>
        <div class="flex-1 space-y-2">
          <div class="h-3 w-1/3 rounded bg-slate-200"></div>
          <div class="h-3 w-1/4 rounded bg-slate-100"></div>
        </div>
      </div>
      <div class="mt-5 space-y-2">
        <div class="h-3 w-full rounded bg-slate-200"></div>
        <div class="h-3 w-5/6 rounded bg-slate-200"></div>
      </div>
      <div class="mt-5 h-64 rounded-xl bg-slate-100"></div>
    </div>
  } @else if (failed()) {
    <div class="fade-up rounded-2xl border border-red-100 bg-white p-8 text-center shadow-sm">
      <i class="fa-regular fa-face-frown mb-3 text-3xl text-slate-400"></i>
      <p class="text-slate-600">Couldn't load this post.</p>
    </div>
  } @else if (post(); as p) {
    <div class="fade-up">
      <app-post [post]="p" [detailsMode]="true" (deleted)="goBack()" />
    </div>
  }
</section>
